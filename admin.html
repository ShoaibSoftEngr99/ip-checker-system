<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - IP Checker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2E86AB;
            --secondary: #A23B72;
            --danger: #D7263D;
            --success: #1B998B;
            --warning: #F46036;
            --dark: #212529;
            --light: #F8F9FA;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .login-container {
            max-width: 450px;
            margin: 50px auto;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.15);
            display: block;
        }

        .login-form {
            text-align: center;
        }

        .login-form h2 {
            margin-bottom: 30px;
            color: var(--dark);
            font-size: 2.2rem;
        }

        .form-group {
            margin-bottom: 25px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: var(--dark);
        }

        .form-group input {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid #E9ECEF;
            border-radius: 12px;
            font-size: 1rem;
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
        }

        .admin-container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.15);
            display: none;
        }

        .admin-header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 30px;
            text-align: center;
            position: relative;
        }

        .admin-header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .admin-nav {
            background: var(--light);
            padding: 0 30px;
        }

        .nav-tabs {
            display: flex;
            list-style: none;
        }

        .nav-tab {
            padding: 20px 30px;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            font-weight: 600;
        }

        .nav-tab.active {
            border-bottom-color: var(--primary);
            color: var(--primary);
            background: white;
        }

        .tab-content {
            display: none;
            padding: 30px;
        }

        .tab-content.active {
            display: block;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border-left: 5px solid var(--primary);
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--primary);
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .data-table th,
        .data-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #dee2e6;
        }

        .data-table th {
            background: var(--light);
            font-weight: 600;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .logout-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--danger);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
        }

        .user-form {
            background: var(--light);
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
            .nav-tabs {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div class="login-container" id="loginContainer">
        <div class="login-form">
            <h2><i class="fas fa-lock"></i> Admin Login</h2>
            <div class="form-group">
                <label for="adminPassword">Admin Password:</label>
                <input type="password" id="adminPassword" placeholder="Enter admin password">
            </div>
            <button class="login-btn" onclick="login()">
                <i class="fas fa-sign-in-alt"></i> Login to Admin Panel
            </button>
        </div>
    </div>

    <!-- Admin Panel -->
    <div class="admin-container" id="adminContainer">
        <button class="logout-btn" onclick="logout()">
            <i class="fas fa-sign-out-alt"></i> Logout
        </button>
        
        <div class="admin-header">
            <h1><i class="fas fa-cogs"></i> Admin Panel</h1>
            <p>IP Verification System Management</p>
        </div>

        <div class="admin-nav">
            <ul class="nav-tabs">
                <li class="nav-tab active" onclick="switchTab('dashboard')">Dashboard</li>
                <li class="nav-tab" onclick="switchTab('users')">User Management</li>
                <li class="nav-tab" onclick="switchTab('ips')">IP Management</li>
            </ul>
        </div>

        <!-- Dashboard Tab -->
        <div id="dashboard-tab" class="tab-content active">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-number" id="todayCount">0</div>
                    <div class="stat-label">Today's IPs</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="totalCount">0</div>
                    <div class="stat-label">Total IPs</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="totalUsers">0</div>
                    <div class="stat-label">Total Users</div>
                </div>
            </div>
        </div>

        <!-- User Management Tab -->
        <div id="users-tab" class="tab-content">
            <div class="user-form">
                <h3>Create New User</h3>
                <div class="form-row">
                    <input type="text" id="newUserId" placeholder="User ID">
                    <input type="text" id="newUserName" placeholder="Username">
                    <input type="password" id="newUserPassword" placeholder="Password">
                </div>
                <button class="btn btn-primary" onclick="createUser()">Create User</button>
            </div>

            <table class="data-table">
                <thead>
                    <tr>
                        <th>User ID</th>
                        <th>Username</th>
                        <th>Password</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="usersTable">
                </tbody>
            </table>
        </div>

        <!-- IP Management Tab -->
        <div id="ips-tab" class="tab-content">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>IP Address</th>
                        <th>User</th>
                        <th>Type</th>
                        <th>Date</th>
                    </tr>
                </thead>
                <tbody id="allIPsTable">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // SIMPLE STORAGE - SAME AS USER PANEL
        const STORAGE_PREFIX = 'ipv_';
        
        function getStorage(key) {
            try {
                const fullKey = STORAGE_PREFIX + key;
                const item = localStorage.getItem(fullKey);
                return item ? JSON.parse(item) : null;
            } catch (e) {
                return null;
            }
        }

        function setStorage(key, value) {
            try {
                const fullKey = STORAGE_PREFIX + key;
                localStorage.setItem(fullKey, JSON.stringify(value));
                return true;
            } catch (e) {
                return false;
            }
        }

        function getAllUsers() {
            return getStorage('users') || {};
        }

        function saveAllUsers(users) {
            return setStorage('users', users);
        }

        function getAllIPs() {
            return getStorage('all_ips') || [];
        }

        function login() {
            const password = document.getElementById('adminPassword').value;
            if (password === "admin123") {
                document.getElementById('loginContainer').style.display = 'none';
                document.getElementById('adminContainer').style.display = 'block';
                loadAdminData();
            } else {
                alert('Invalid password! Use: admin123');
            }
        }

        function logout() {
            document.getElementById('loginContainer').style.display = 'block';
            document.getElementById('adminContainer').style.display = 'none';
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.nav-tab').forEach(tab => {
                tab.classList.remove('active');
            });

            document.getElementById(tabName + '-tab').classList.add('active');
            event.currentTarget.classList.add('active');

            if (tabName === 'users') loadUsersData();
            if (tabName === 'ips') loadIPsData();
        }

        function loadAdminData() {
            const allIPs = getAllIPs();
            const users = getAllUsers();
            
            let todayCount = 0;
            const today = new Date().toDateString();

            Object.values(users).forEach(user => {
                const dailyIPs = getStorage(`daily_${user.id}_${today}`) || [];
                todayCount += dailyIPs.length;
            });

            document.getElementById('todayCount').textContent = todayCount;
            document.getElementById('totalCount').textContent = allIPs.length;
            document.getElementById('totalUsers').textContent = Object.keys(users).length;
        }

        function loadUsersData() {
            const users = getAllUsers();
            const usersTable = document.getElementById('usersTable');
            usersTable.innerHTML = '';

            Object.values(users).forEach(user => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${user.id}</td>
                    <td>${user.name}</td>
                    <td>${user.password}</td>
                    <td>
                        <button class="btn btn-danger" onclick="deleteUser('${user.id}')">Delete</button>
                    </td>
                `;
                usersTable.appendChild(row);
            });
        }

        function createUser() {
            const userId = document.getElementById('newUserId').value.trim();
            const userName = document.getElementById('newUserName').value.trim();
            const password = document.getElementById('newUserPassword').value.trim();

            if (!userId || !userName || !password) {
                alert('Please fill all fields!');
                return;
            }

            const users = getAllUsers();
            
            if (users[userId]) {
                alert('User ID already exists!');
                return;
            }

            users[userId] = {
                id: userId,
                name: userName,
                password: password,
                status: 'Active'
            };

            saveAllUsers(users);
            document.getElementById('newUserId').value = '';
            document.getElementById('newUserName').value = '';
            document.getElementById('newUserPassword').value = '';
            loadUsersData();
            alert('User created successfully!');
        }

        function deleteUser(userId) {
            if (userId === 'admin') {
                alert('Cannot delete admin user!');
                return;
            }

            if (confirm('Delete this user?')) {
                const users = getAllUsers();
                delete users[userId];
                saveAllUsers(users);
                loadUsersData();
            }
        }

        function loadIPsData() {
            const allIPs = getAllIPs();
            const allIPsTable = document.getElementById('allIPsTable');
            allIPsTable.innerHTML = '';
            
            allIPs.slice(-50).reverse().forEach(entry => {
                const row = document.createElement('tr');
                const date = new Date(entry.timestamp);
                row.innerHTML = `
                    <td>${entry.ip}</td>
                    <td>${entry.userName || entry.userId}</td>
                    <td>${entry.type}</td>
                    <td>${date.toLocaleString()}</td>
                `;
                allIPsTable.appendChild(row);
            });
        }

        // Auto-refresh
        setInterval(() => {
            if (document.getElementById('adminContainer').style.display === 'block') {
                loadAdminData();
            }
        }, 10000);
    </script>
</body>
</html>
