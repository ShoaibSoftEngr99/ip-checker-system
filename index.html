<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP Verification System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2E86AB;
            --secondary: #A23B72;
            --success: #1B998B;
            --danger: #D7263D;
            --warning: #F46036;
            --light: #F8F9FA;
            --dark: #212529;
            --gray: #6C757D;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            max-width: 450px;
            width: 100%;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.15);
            display: block;
            position: relative;
            overflow: hidden;
        }

        .login-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
        }

        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .login-header h1 {
            color: var(--dark);
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .login-header p {
            color: var(--gray);
            font-size: 1.1rem;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: var(--dark);
            font-size: 1rem;
        }

        .form-group input {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid #E9ECEF;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s;
            background: var(--light);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(46, 134, 171, 0.1);
            background: white;
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
            box-shadow: 0 8px 25px rgba(46, 134, 171, 0.3);
        }

        .login-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(46, 134, 171, 0.4);
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.15);
            position: relative;
            overflow: hidden;
            display: none;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
        }

        .header h1 {
            color: var(--dark);
            font-size: 2.2rem;
            margin-bottom: 8px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: var(--gray);
            font-size: 1rem;
        }

        .logout-btn {
            position: absolute;
            top: 0;
            right: 0;
            background: linear-gradient(135deg, var(--danger), #C81E4A);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(215, 38, 61, 0.3);
            transition: all 0.3s;
            font-size: 0.9rem;
        }

        .logout-btn:hover {
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 6px 20px rgba(215, 38, 61, 0.4);
        }

        .ip-type-section {
            background: linear-gradient(135deg, #F8F9FF, #F0F4FF);
            padding: 25px;
            border-radius: 15px;
            margin: 20px 0;
            border: 2px solid #E9ECEF;
        }

        .ip-type-section h3 {
            text-align: center;
            margin-bottom: 20px;
            color: var(--dark);
            font-size: 1.2rem;
            font-weight: 600;
        }

        .checkboxes-compact {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            max-width: 500px;
            margin: 0 auto;
        }

        .checkbox-compact {
            background: white;
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #E9ECEF;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .checkbox-compact.selected {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border-color: var(--primary);
            box-shadow: 0 6px 18px rgba(46, 134, 171, 0.3);
            transform: translateY(-2px);
        }

        .checkbox-compact input {
            display: none;
        }

        .checkbox-compact i {
            font-size: 1.5rem;
            margin-bottom: 8px;
            display: block;
        }

        .checkbox-compact span {
            font-weight: 600;
            font-size: 0.85rem;
        }

        .ip-input-section {
            background: linear-gradient(135deg, #F8F9FF, #F0F4FF);
            padding: 25px;
            border-radius: 15px;
            margin: 25px 0;
            border: 2px dashed #D0D7FF;
        }

        .ip-input-group {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .ip-input-group input {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid #E9ECEF;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s;
            background: white;
        }

        .ip-input-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(46, 134, 171, 0.1);
        }

        .upload-btn {
            padding: 14px 25px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 6px 20px rgba(46, 134, 171, 0.3);
        }

        .upload-btn:hover {
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 8px 25px rgba(46, 134, 171, 0.4);
        }

        .daily-counter {
            text-align: center;
            margin-top: 20px;
            padding: 20px;
            background: linear-gradient(135deg, #A23B72, #C44569);
            color: white;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(162, 59, 114, 0.3);
        }

        .counter-number {
            font-size: 2.8rem;
            font-weight: 700;
            display: block;
            margin-bottom: 5px;
        }

        .counter-label {
            font-size: 1rem;
            opacity: 0.9;
            font-weight: 600;
        }

        .verification-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }

        .verification-modal.active {
            opacity: 1;
            visibility: visible;
        }

        .verification-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
        }

        .verification-icon {
            font-size: 4rem;
            color: var(--success);
            margin-bottom: 20px;
        }

        .verification-content h3 {
            color: var(--dark);
            margin-bottom: 15px;
            font-size: 1.8rem;
        }

        .verification-content p {
            color: var(--gray);
            margin-bottom: 25px;
            font-size: 1.1rem;
            line-height: 1.5;
        }

        .verification-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
            max-width: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-success {
            background: linear-gradient(135deg, var(--success), #168B7D);
            color: white;
            box-shadow: 0 5px 15px rgba(27, 153, 139, 0.3);
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--danger), #C81E4A);
            color: white;
            box-shadow: 0 5px 15px rgba(215, 38, 61, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-weight: 600;
            display: none;
            font-size: 1rem;
        }

        .message.success {
            background: #E8F5E8;
            color: #155724;
            border: 2px solid #C3E6CB;
        }

        .message.error {
            background: #FDE8E8;
            color: #721C24;
            border: 2px solid #F5C6CB;
        }

        .notification {
            position: fixed;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            padding: 20px 30px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1.1rem;
            z-index: 1001;
            display: none;
            min-width: 400px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }

        .notification.success {
            background: linear-gradient(135deg, #E8F5E8, #D4EDDA);
            color: #155724;
            border: 2px solid #C3E6CB;
        }

        .notification.error {
            background: linear-gradient(135deg, #FDE8E8, #F8D7DA);
            color: #721C24;
            border: 2px solid #F5C6CB;
        }

        @media (max-width: 768px) {
            .login-container, .container {
                padding: 25px;
                margin: 10px;
            }
            
            .checkboxes-compact {
                grid-template-columns: 1fr;
            }
            
            .ip-input-group {
                flex-direction: column;
            }
            
            .verification-buttons {
                flex-direction: column;
            }
            
            .btn {
                max-width: 100%;
            }
            
            .notification {
                min-width: 90%;
            }
        }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div class="login-container" id="loginContainer">
        <div class="login-header">
            <h1><i class="fas fa-shield-alt"></i> IP Verification</h1>
            <p>Secure IP Management System</p>
        </div>

        <div class="form-group">
            <label for="username"><i class="fas fa-user"></i> Username:</label>
            <input type="text" id="username" placeholder="Enter your username">
        </div>

        <div class="form-group">
            <label for="password"><i class="fas fa-lock"></i> Password:</label>
            <input type="password" id="password" placeholder="Enter your password">
        </div>

        <button class="login-btn" onclick="login()">
            <i class="fas fa-sign-in-alt"></i> Login to System
        </button>

        <div id="loginMessage" class="message" style="margin-top: 20px;"></div>
    </div>

    <!-- Main Application -->
    <div class="container" id="mainContainer">
        <div class="header">
            <h1><i class="fas fa-shield-alt"></i> IP Verification</h1>
            <p>Secure IP Management Dashboard</p>
            <button class="logout-btn" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>

        <!-- Compact IP Type Selection -->
        <div class="ip-type-section">
            <h3>Select IP Type</h3>
            <div class="checkboxes-compact">
                <div class="checkbox-compact" onclick="selectCheckbox('session')">
                    <input type="checkbox" id="sessionCheck" name="checkType" value="session">
                    <i class="fas fa-globe-americas"></i>
                    <span>Session IP</span>
                </div>
                <div class="checkbox-compact" onclick="selectCheckbox('search')">
                    <input type="checkbox" id="searchCheck" name="checkType" value="search">
                    <i class="fas fa-search"></i>
                    <span>Search IP</span>
                </div>
                <div class="checkbox-compact" onclick="selectCheckbox('click')">
                    <input type="checkbox" id="clickCheck" name="checkType" value="click">
                    <i class="fas fa-mouse-pointer"></i>
                    <span>Click IP</span>
                </div>
            </div>
        </div>

        <!-- IP Input Section -->
        <div class="ip-input-section">
            <div class="ip-input-group">
                <input type="text" id="ipAddress" placeholder="Enter IP Address (e.g., 192.168.1.1)">
                <button class="upload-btn" onclick="uploadIP()">
                    <i class="fas fa-cloud-upload-alt"></i> Upload IP
                </button>
            </div>
        </div>

        <!-- Daily Counter -->
        <div class="daily-counter">
            <span class="counter-number" id="totalDailyCount">0</span>
            <span class="counter-label">IPs Uploaded Today</span>
        </div>

        <div id="message" class="message"></div>
    </div>

    <!-- Verification Modal -->
    <div class="verification-modal" id="verificationModal">
        <div class="verification-content">
            <div class="verification-icon">
                <i class="fas fa-link"></i>
            </div>
            <h3>Link Verification Required</h3>
            <p>Please verify if your link is working properly and accessible at the provided IP address:</p>
            <p style="font-weight: 700; font-size: 1.2rem; color: var(--primary);" id="verificationIP"></p>
            <div class="verification-buttons">
                <button class="btn btn-success" onclick="confirmLink(true)">
                    <i class="fas fa-check-circle"></i> Yes, Working
                </button>
                <button class="btn btn-danger" onclick="confirmLink(false)">
                    <i class="fas fa-times-circle"></i> Not Working
                </button>
            </div>
        </div>
    </div>

    <!-- Global Notification -->
    <div id="globalNotification" class="notification"></div>

    <script>
        // SIMPLE STORAGE SYSTEM
        const STORAGE_PREFIX = 'ipv_';
        
        function getStorage(key) {
            try {
                const fullKey = STORAGE_PREFIX + key;
                const item = localStorage.getItem(fullKey);
                return item ? JSON.parse(item) : null;
            } catch (e) {
                return null;
            }
        }

        function setStorage(key, value) {
            try {
                const fullKey = STORAGE_PREFIX + key;
                localStorage.setItem(fullKey, JSON.stringify(value));
                return true;
            } catch (e) {
                return false;
            }
        }

        // SIMPLE USER SYSTEM - NO COMPLEX LOGIC
        function getAllUsers() {
            let users = getStorage('users');
            if (!users) {
                users = {
                    'admin': { 
                        id: 'admin', 
                        name: 'Administrator', 
                        password: 'admin123', 
                        status: 'Active'
                    },
                    'user1': { 
                        id: 'user1', 
                        name: 'John Smith', 
                        password: 'password1', 
                        status: 'Active'
                    },
                    'user2': { 
                        id: 'user2', 
                        name: 'Sarah Johnson', 
                        password: 'password2', 
                        status: 'Active'
                    },
                    'demo': { 
                        id: 'demo', 
                        name: 'Demo User', 
                        password: 'demo123', 
                        status: 'Active'
                    },
                    'liveagent': { 
                        id: 'liveagent', 
                        name: 'Live Agent', 
                        password: 'blueston123', 
                        status: 'Active'
                    }
                };
                setStorage('users', users);
            }
            return users;
        }

        function getCurrentUser() {
            return getStorage('current_user');
        }

        function saveCurrentUser(user) {
            return setStorage('current_user', user);
        }

        function getAllIPs() {
            return getStorage('all_ips') || [];
        }

        function saveAllIPs(ips) {
            return setStorage('all_ips', ips);
        }

        function getDailyIPs(userId) {
            const today = new Date().toDateString();
            const key = `daily_${userId}_${today}`;
            return getStorage(key) || [];
        }

        function saveDailyIPs(userId, ips) {
            const today = new Date().toDateString();
            const key = `daily_${userId}_${today}`;
            return setStorage(key, ips);
        }

        function showNotification(message, type = 'success') {
            const notification = document.getElementById('globalNotification');
            notification.textContent = message;
            notification.className = `notification ${type}`;
            notification.style.display = 'block';
            
            setTimeout(() => {
                notification.style.display = 'none';
            }, 5000);
        }

        let currentUser = null;
        let currentIP = '';

        // SIMPLE LOGIN FUNCTION
        function login() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const loginMessage = document.getElementById('loginMessage');

            if (!username || !password) {
                showMessage('Please enter both username and password!', 'error', loginMessage);
                return;
            }

            const allUsers = getAllUsers();
            
            // DIRECT UNIVERSAL LOGIN CHECK - SIMPLE AND CLEAN
            if (username === 'liveagent123@gmail.com' && password === 'blueston123') {
                currentUser = allUsers['liveagent'];
                saveCurrentUser(currentUser);
                showSuccess();
                return;
            }

            // REGULAR USER LOGIN
            const user = Object.values(allUsers).find(u => 
                (u.name.toLowerCase() === username.toLowerCase() || u.id === username.toLowerCase()) && 
                u.password === password
            );

            if (user) {
                if (user.status === 'Inactive') {
                    showMessage('Your account is inactive. Please contact administrator.', 'error', loginMessage);
                    return;
                }
                currentUser = user;
                saveCurrentUser(user);
                showSuccess();
            } else {
                showMessage('Invalid username or password! Try: liveagent123@gmail.com / blueston123', 'error', loginMessage);
            }
        }

        function showSuccess() {
            document.getElementById('loginContainer').style.display = 'none';
            document.getElementById('mainContainer').style.display = 'block';
            showNotification(`🎉 Welcome, ${currentUser.name}!`, 'success');
            updateDashboardStats();
        }

        function showMessage(text, type, element) {
            element.textContent = text;
            element.className = `message ${type}`;
            element.style.display = 'block';
        }

        function logout() {
            currentUser = null;
            setStorage('current_user', null);
            document.getElementById('mainContainer').style.display = 'none';
            document.getElementById('loginContainer').style.display = 'block';
            document.getElementById('password').value = '';
            document.getElementById('loginMessage').style.display = 'none';
            showNotification('You have been logged out successfully!', 'warning');
        }

        function checkLoginStatus() {
            const user = getCurrentUser();
            if (user) {
                currentUser = user;
                document.getElementById('loginContainer').style.display = 'none';
                document.getElementById('mainContainer').style.display = 'block';
                updateDashboardStats();
            }
        }

        function updateDashboardStats() {
            if (!currentUser) return;
            const dailyIPs = getDailyIPs(currentUser.id);
            document.getElementById('totalDailyCount').textContent = dailyIPs.length;
        }

        function selectCheckbox(type) {
            document.querySelectorAll('.checkbox-compact').forEach(card => {
                card.classList.remove('selected');
            });
            const card = event.currentTarget;
            card.classList.add('selected');
            document.querySelectorAll('input[name="checkType"]').forEach(checkbox => {
                checkbox.checked = false;
            });
            document.getElementById(type + 'Check').checked = true;
        }
        
        function getSelectedCheckType() {
            const selected = document.querySelector('input[name="checkType"]:checked');
            return selected ? selected.value : '';
        }
        
        function uploadIP() {
            if (!currentUser) {
                showNotification('Please login first!', 'error');
                return;
            }

            const selectedCheckbox = document.querySelector('input[name="checkType"]:checked');
            const ipAddress = document.getElementById('ipAddress').value.trim();
            
            if (!selectedCheckbox) {
                showNotification('Please select an IP type!', 'error');
                return;
            }
            
            if (!ipAddress) {
                showNotification('Please enter an IP address!', 'error');
                return;
            }
            
            const ipPattern = /^(\d{1,3}\.){3}\d{1,3}$/;
            if (!ipPattern.test(ipAddress)) {
                showNotification('Please enter a valid IP address (e.g., 192.168.1.1)!', 'error');
                return;
            }
            
            const allIPs = getAllIPs();
            const userIPs = allIPs.filter(ip => ip.userId === currentUser.id);
            if (userIPs.some(entry => entry.ip === ipAddress)) {
                showNotification('❌ This IP address has already been uploaded!', 'error');
                return;
            }
            
            const dailyIPs = getDailyIPs(currentUser.id);
            if (dailyIPs.some(entry => entry.ip === ipAddress)) {
                showNotification('❌ This IP address has already been uploaded today!', 'error');
                return;
            }
            
            currentIP = ipAddress;
            document.getElementById('verificationIP').textContent = ipAddress;
            showVerificationModal();
        }
        
        function showVerificationModal() {
            document.getElementById('verificationModal').classList.add('active');
        }
        
        function hideVerificationModal() {
            document.getElementById('verificationModal').classList.remove('active');
        }
        
        function confirmLink(isWorking) {
            if (isWorking) {
                const dailyIPs = getDailyIPs(currentUser.id);
                dailyIPs.push({
                    ip: currentIP,
                    timestamp: new Date().toISOString(),
                    type: getSelectedCheckType(),
                    userId: currentUser.id
                });
                saveDailyIPs(currentUser.id, dailyIPs);
                
                const allIPs = getAllIPs();
                allIPs.push({
                    ip: currentIP,
                    timestamp: new Date().toISOString(),
                    type: getSelectedCheckType(),
                    userId: currentUser.id,
                    userName: currentUser.name
                });
                saveAllIPs(allIPs);
                
                showNotification(`✅ IP ${currentIP} successfully uploaded!`, 'success');
            } else {
                showNotification(`❌ IP ${currentIP} verification failed.`, 'error');
            }
            
            document.getElementById('ipAddress').value = '';
            document.querySelectorAll('.checkbox-compact').forEach(card => {
                card.classList.remove('selected');
            });
            document.querySelectorAll('input[name="checkType"]').forEach(checkbox => {
                checkbox.checked = false;
            });
            
            updateDashboardStats();
            hideVerificationModal();
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            getAllUsers(); // Ensure users exist
            checkLoginStatus();
            
            // Enter key support
            document.getElementById('password').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') login();
            });

            // Close modal when clicking outside
            document.getElementById('verificationModal').addEventListener('click', function(e) {
                if (e.target === this) hideVerificationModal();
            });
        });
    </script>
</body>
</html>
